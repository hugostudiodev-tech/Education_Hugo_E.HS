<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" aria-hidden="true">
  <!-- Leo (♌, Sư Tử) — mascot cung hoàng đạo của Education Hugo. Thiết kế gốc © Hugo Studio.
       Theo khuôn geminus.svg (style đất sét cast-*.svg). Riêng Leo: thân cam #FF9A2E đốm vàng #FFD23F, bờm cánh tròn #E0661C phập phồng, mõm sáng có mũi. -->
  <style>
    .m-hop{transform-box:fill-box;transform-origin:50% 100%;animation:m-hop 1.2s cubic-bezier(.3,0,.4,1) infinite}
    .m-shadow{transform-box:fill-box;transform-origin:50% 50%;animation:m-shadow 1.2s cubic-bezier(.3,0,.4,1) infinite}
    .m-eye{transform-box:fill-box;transform-origin:50% 50%;animation:m-blink 3.6s infinite}
    .m-mouth{transform-box:fill-box;transform-origin:50% 0;animation:m-grin 1.2s ease-in-out infinite}
    .m-flick{transform-box:fill-box;transform-origin:100% 50%;animation:m-flick 2.4s ease-in-out infinite}
    .m-sway{transform-box:fill-box;transform-origin:50% 0;animation:m-sway 1.2s ease-in-out infinite}
    @keyframes m-hop{0%,100%{transform:translateY(0) scale(1.05,.94)}15%{transform:translateY(0) scale(.96,1.05)}45%{transform:translateY(-7px) rotate(-3deg)}70%{transform:translateY(0) scale(1.03,.96) rotate(2deg)}}
    @keyframes m-shadow{0%,100%,70%{transform:scale(1)}45%{transform:scale(.72);opacity:.6}}
    @keyframes m-blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
    @keyframes m-grin{0%,100%{transform:scaleY(1)}45%{transform:scaleY(1.2)}}
    @keyframes m-flick{0%,78%,100%{transform:rotate(0)}86%{transform:rotate(-20deg)}}
    @keyframes m-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
    .m-mane{transform-box:view-box;transform-origin:50px 60px;animation:m-mane 1.2s ease-in-out infinite}
    @keyframes m-mane{0%,100%{transform:rotate(-4deg) scale(1)}45%{transform:rotate(4deg) scale(1.04)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <path id="m-body" d="M27 92c-4-9-5-19-3-30 3-16 12-28 26-28s23 12 26 28c2 11 1 21-3 30-9 1.6-37 1.6-46 0"/>
    <clipPath id="m-clip"><use href="#m-body"/></clipPath>
    <mask id="m-lit"><use href="#m-body" fill="#fff"/><use href="#m-body" fill="#000" transform="translate(2.8 3.2)"/></mask>
    <mask id="m-dim"><use href="#m-body" fill="#fff"/><use href="#m-body" fill="#000" transform="translate(-2.8 -3.2)"/></mask>
  </defs>

  <ellipse class="m-shadow" cx="50" cy="92.8" rx="26" ry="3.2" fill="#44403c" opacity=".13"/>

  <g class="m-hop">
    <g class="m-mane" fill="#e0661c"><circle cx="75.1" cy="66.7" r="8.5"/><circle cx="76.0" cy="60.0" r="8.5"/><circle cx="75.1" cy="53.3" r="8.5"/><circle cx="72.5" cy="47.0" r="8.5"/><circle cx="68.4" cy="41.6" r="8.5"/><circle cx="63.0" cy="37.5" r="8.5"/><circle cx="56.7" cy="34.9" r="8.5"/><circle cx="50.0" cy="34.0" r="8.5"/><circle cx="43.3" cy="34.9" r="8.5"/><circle cx="37.0" cy="37.5" r="8.5"/><circle cx="31.6" cy="41.6" r="8.5"/><circle cx="27.5" cy="47.0" r="8.5"/><circle cx="24.9" cy="53.3" r="8.5"/><circle cx="24.0" cy="60.0" r="8.5"/><circle cx="24.9" cy="66.7" r="8.5"/></g>
    <circle cx="35" cy="35" r="5" fill="#ff9a2e"/><circle cx="35" cy="35" r="2.6" fill="#ffd23f"/><circle cx="65" cy="35" r="5" fill="#ff9a2e"/><circle cx="65" cy="35" r="2.6" fill="#ffd23f"/>
    <g clip-path="url(#m-clip)">
      <rect width="100" height="100" fill="#ff9a2e"/>
      <g fill="#ffd23f"><circle cx="50" cy="40" r="2.2"/><circle cx="44" cy="38.5" r="1.5"/><circle cx="56" cy="38.5" r="1.5"/><circle cx="35" cy="83" r="3"/><circle cx="62" cy="86" r="2.5"/><circle cx="70" cy="77" r="2"/><circle cx="29" cy="74" r="2"/></g>
      <rect width="100" height="100" fill="#fff" opacity=".2" mask="url(#m-lit)"/>
      <rect width="100" height="100" fill="#44403c" opacity=".12" mask="url(#m-dim)"/>
    </g>
    <ellipse cx="50" cy="70" rx="13" ry="9" fill="#ffd9a0"/><path d="M47 61.5h6l-3 3.2Z" fill="#44403c" stroke="#44403c" stroke-width="1" stroke-linejoin="round"/>
    <g transform="translate(29 42)">
      <circle cx="10.5" cy="11" r="7" fill="#44403c" opacity=".15"/><circle cx="32.5" cy="11" r="7" fill="#44403c" opacity=".15"/>
      <circle cx="10" cy="10" r="7" fill="#fff"/><circle cx="32" cy="10" r="7" fill="#fff"/>
      <g class="m-eye"><circle cx="11" cy="11.8" r="2.9" fill="#44403c"/><circle cx="10" cy="10.6" r=".7" fill="#fff" opacity=".7"/></g>
      <g class="m-eye"><circle cx="31" cy="11.8" r="2.9" fill="#44403c"/><circle cx="30" cy="10.6" r=".7" fill="#fff" opacity=".7"/></g>
    </g>
    <ellipse cx="29" cy="66" rx="4" ry="2.4" fill="#ff9ec0" opacity=".8"/>
    <ellipse cx="71" cy="66" rx="4" ry="2.4" fill="#ff9ec0" opacity=".8"/>
    <g transform="translate(37 64)"><g class="m-mouth">
      <path d="M4.5 1.8h17a8.5 8.5 0 0 1-17 0" fill="#44403c"/>
      <path d="M6.3 1.8h13.4v1.6a1.2 1.2 0 0 1-1.2 1.2h-11a1.2 1.2 0 0 1-1.2-1.2Z" fill="#fff"/>
      <path d="M10.5 7h5v.4a2.5 2.5 0 0 1-5 0Z" fill="#c96f5e"/>
    </g></g>
    
  </g>
</svg>
