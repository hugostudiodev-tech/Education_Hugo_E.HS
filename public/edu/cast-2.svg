<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" aria-hidden="true">
  <!-- Cancer (♋, Cự Giải) — mascot cung hoàng đạo của Education Hugo. Thiết kế gốc © Hugo Studio.
       Theo khuôn geminus.svg (style đất sét cast-*.svg). Riêng Cancer: thân cua bè ngang đỏ #F25A3C,
       hai càng vẫy luân phiên và kẹp "tách tách", ba chân nhỏ mỗi bên. -->
  <style>
    .c-hop{transform-box:fill-box;transform-origin:50% 100%;animation:c-hop 1.2s cubic-bezier(.3,0,.4,1) infinite}
    .c-shadow{transform-box:fill-box;transform-origin:50% 50%;animation:c-shadow 1.2s cubic-bezier(.3,0,.4,1) infinite}
    .c-eye{transform-box:fill-box;transform-origin:50% 50%;animation:c-blink 3.6s infinite}
    .c-mouth{transform-box:fill-box;transform-origin:50% 0;animation:c-grin 1.2s ease-in-out infinite}
    .c-arm{transform-box:fill-box;transform-origin:100% 100%;animation:c-wave 1.2s ease-in-out infinite}
    .c-armR{animation-delay:-.6s}
    .c-jawL{transform-box:fill-box;transform-origin:100% 100%;animation:c-snipL .6s ease-in-out infinite}
    .c-jawR{transform-box:fill-box;transform-origin:0 100%;animation:c-snipR .6s ease-in-out infinite}
    @keyframes c-hop{0%,100%{transform:translateY(0) scale(1.05,.94)}15%{transform:translateY(0) scale(.96,1.05)}45%{transform:translateY(-7px) rotate(-3deg)}70%{transform:translateY(0) scale(1.03,.96) rotate(2deg)}}
    @keyframes c-shadow{0%,100%,70%{transform:scale(1)}45%{transform:scale(.72);opacity:.6}}
    @keyframes c-blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
    @keyframes c-grin{0%,100%{transform:scaleY(1)}45%{transform:scaleY(1.2)}}
    @keyframes c-wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
    @keyframes c-snipL{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
    @keyframes c-snipR{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <path id="c-body" d="M22 92c-5-8-6-17-3-26 4-13 16-22 31-22s27 9 31 22c3 9 2 18-3 26-12 1.6-44 1.6-56 0"/>
    <clipPath id="c-clip"><use href="#c-body"/></clipPath>
    <mask id="c-lit"><use href="#c-body" fill="#fff"/><use href="#c-body" fill="#000" transform="translate(2.8 3.2)"/></mask>
    <mask id="c-dim"><use href="#c-body" fill="#fff"/><use href="#c-body" fill="#000" transform="translate(-2.8 -3.2)"/></mask>
    <!-- Một cánh tay + càng (bên trái); bên phải là bản lật gương -->
    <g id="c-arm-shape">
      <path d="M26 70Q16 64 16 52" stroke="#f25a3c" stroke-width="5" stroke-linecap="round"/>
      <path d="M26 70Q16 64 16 52" stroke="#44403c" stroke-width="5" stroke-linecap="round" opacity=".1"/>
      <g transform="translate(16 50)">
        <path class="c-jawL" d="M0 2C-7 2-9-6-6-12c1-2 3-3 5-3l0 9Z" fill="#f25a3c"/>
        <path class="c-jawR" d="M0 2C7 2 9-6 6-12c-1-2-3-3-5-3l0 9Z" fill="#f25a3c"/>
        <path d="M-6-11c1-2 2.5-3 4-3.2" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".45"/>
      </g>
    </g>
  </defs>

  <ellipse class="c-shadow" cx="50" cy="92.8" rx="30" ry="3.2" fill="#44403c" opacity=".13"/>

  <g class="c-hop">
    <!-- Chân (sau thân) -->
    <path d="M22 78l-8 1M21 84l-8 4M24 89l-6 5M78 78l8 1M79 84l8 4M76 89l6 5" stroke="#c9432a" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Hai càng -->
    <g class="c-arm"><use href="#c-arm-shape"/></g>
    <g transform="translate(100 0) scale(-1 1)"><g class="c-arm c-armR"><use href="#c-arm-shape"/></g></g>

    <!-- Thân + viền đất sét -->
    <g clip-path="url(#c-clip)">
      <rect width="100" height="100" fill="#f25a3c"/>
      <rect width="100" height="100" fill="#fff" opacity=".2" mask="url(#c-lit)"/>
      <rect width="100" height="100" fill="#44403c" opacity=".12" mask="url(#c-dim)"/>
      <!-- Chấm vỏ cua -->
      <circle cx="40" cy="49" r="1.4" fill="#fff" opacity=".35"/><circle cx="50" cy="47" r="1.4" fill="#fff" opacity=".35"/><circle cx="60" cy="49" r="1.4" fill="#fff" opacity=".35"/>
    </g>

    <!-- Mắt (eyes-even) -->
    <g transform="translate(29 52)">
      <circle cx="10.5" cy="11" r="7" fill="#44403c" opacity=".15"/><circle cx="32.5" cy="11" r="7" fill="#44403c" opacity=".15"/>
      <circle cx="10" cy="10" r="7" fill="#fff"/><circle cx="32" cy="10" r="7" fill="#fff"/>
      <g class="c-eye"><circle cx="11" cy="11.8" r="2.9" fill="#44403c"/><circle cx="10" cy="10.6" r=".7" fill="#fff" opacity=".7"/></g>
      <g class="c-eye"><circle cx="31" cy="11.8" r="2.9" fill="#44403c"/><circle cx="30" cy="10.6" r=".7" fill="#fff" opacity=".7"/></g>
    </g>

    <ellipse cx="30" cy="73" rx="4" ry="2.4" fill="#ffc2d4" opacity=".8"/>
    <ellipse cx="70" cy="73" rx="4" ry="2.4" fill="#ffc2d4" opacity=".8"/>

    <!-- Miệng cười (mouth-laugh) -->
    <g transform="translate(37 71)"><g class="c-mouth">
      <path d="M4.5 1.8h17a8.5 8.5 0 0 1-17 0" fill="#44403c"/>
      <path d="M6.3 1.8h13.4v1.6a1.2 1.2 0 0 1-1.2 1.2h-11a1.2 1.2 0 0 1-1.2-1.2Z" fill="#fff"/>
      <path d="M10.5 7h5v.4a2.5 2.5 0 0 1-5 0Z" fill="#c96f5e"/>
    </g></g>
  </g>
</svg>
