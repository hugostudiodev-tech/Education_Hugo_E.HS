<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" aria-hidden="true">
  <!-- Pisces (♓, Song Ngư) — mascot cung hoàng đạo của Education Hugo. Thiết kế gốc © Hugo Studio.
       Theo khuôn geminus.svg (style đất sét cast-*.svg). Riêng Pisces: thân cá tím oải hương #9D7CF2,
       đuôi quẫy, vây lưng + vây ngực phe phẩy, bong bóng nổi lên. -->
  <style>
    .p-hop{transform-box:fill-box;transform-origin:50% 100%;animation:p-hop 1.2s cubic-bezier(.3,0,.4,1) infinite}
    .p-shadow{transform-box:fill-box;transform-origin:50% 50%;animation:p-shadow 1.2s cubic-bezier(.3,0,.4,1) infinite}
    .p-eye{transform-box:fill-box;transform-origin:50% 50%;animation:p-blink 3.6s infinite}
    .p-mouth{transform-box:fill-box;transform-origin:50% 0;animation:p-grin 1.2s ease-in-out infinite}
    .p-tail{transform-box:view-box;transform-origin:74px 66px;animation:p-wag .6s ease-in-out infinite}
    .p-fin{transform-box:fill-box;transform-origin:0 0;animation:p-flap .6s ease-in-out infinite}
    .p-bub{transform-box:fill-box;animation:p-bub 2.4s ease-out infinite}
    .p-bub:nth-of-type(2){animation-delay:-.8s}
    .p-bub:nth-of-type(3){animation-delay:-1.6s}
    @keyframes p-hop{0%,100%{transform:translateY(0) scale(1.05,.94)}15%{transform:translateY(0) scale(.96,1.05)}45%{transform:translateY(-7px) rotate(-3deg)}70%{transform:translateY(0) scale(1.03,.96) rotate(2deg)}}
    @keyframes p-shadow{0%,100%,70%{transform:scale(1)}45%{transform:scale(.72);opacity:.6}}
    @keyframes p-blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
    @keyframes p-grin{0%,100%{transform:scaleY(1)}45%{transform:scaleY(1.2)}}
    @keyframes p-wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
    @keyframes p-flap{0%,100%{transform:rotate(0)}50%{transform:rotate(25deg)}}
    @keyframes p-bub{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-22px);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <path id="p-body" d="M16 66C16 48 32 42 46 42S70 54 76 66C70 78 60 90 46 90S16 84 16 66Z"/>
    <clipPath id="p-clip"><use href="#p-body"/></clipPath>
    <mask id="p-lit"><use href="#p-body" fill="#fff"/><use href="#p-body" fill="#000" transform="translate(2.8 3.2)"/></mask>
    <mask id="p-dim"><use href="#p-body" fill="#fff"/><use href="#p-body" fill="#000" transform="translate(-2.8 -3.2)"/></mask>
  </defs>

  <ellipse class="p-shadow" cx="47" cy="92.8" rx="28" ry="3.2" fill="#44403c" opacity=".13"/>

  <!-- Bong bóng -->
  <g fill="none" stroke="#9d7cf2" stroke-width="1.2">
    <circle class="p-bub" cx="20" cy="40" r="2.2"/>
    <circle class="p-bub" cx="14" cy="44" r="1.6"/>
    <circle class="p-bub" cx="24" cy="46" r="1.3"/>
  </g>

  <g class="p-hop">
    <!-- Đuôi + vây lưng (sau thân) -->
    <g class="p-tail">
      <path d="M72 66 90 50c3 9 3 23 0 32Z" fill="#9d7cf2"/>
      <path d="M72 66 90 50c3 9 3 23 0 32Z" fill="#44403c" opacity=".12"/>
      <path d="M78 64l9-8M78 68l9 8" stroke="#fff" stroke-width="1.1" stroke-linecap="round" opacity=".45"/>
    </g>
    <path d="M36 45c3-10 15-13 23-7l-3 8Z" fill="#9d7cf2"/>
    <path d="M36 45c3-10 15-13 23-7l-3 8Z" fill="#44403c" opacity=".1"/>

    <!-- Thân + viền đất sét -->
    <g clip-path="url(#p-clip)">
      <rect width="100" height="100" fill="#9d7cf2"/>
      <rect width="100" height="100" fill="#fff" opacity=".2" mask="url(#p-lit)"/>
      <rect width="100" height="100" fill="#44403c" opacity=".12" mask="url(#p-dim)"/>
      <!-- Vảy -->
      <path d="M64 52a4 4 0 0 1 0 6M69 57a4 4 0 0 1 0 6M64 60a4 4 0 0 1 0 6" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".4"/>
    </g>

    <!-- Vây ngực phe phẩy -->
    <path class="p-fin" d="M56 78c6 0 10 3 11 8-5 0-9-2-11-8Z" fill="#7d5ce0"/>

    <!-- Mắt (eyes-even) -->
    <g transform="translate(22 52)">
      <circle cx="10.5" cy="11" r="7" fill="#44403c" opacity=".15"/><circle cx="32.5" cy="11" r="7" fill="#44403c" opacity=".15"/>
      <circle cx="10" cy="10" r="7" fill="#fff"/><circle cx="32" cy="10" r="7" fill="#fff"/>
      <g class="p-eye"><circle cx="11" cy="11.8" r="2.9" fill="#44403c"/><circle cx="10" cy="10.6" r=".7" fill="#fff" opacity=".7"/></g>
      <g class="p-eye"><circle cx="31" cy="11.8" r="2.9" fill="#44403c"/><circle cx="30" cy="10.6" r=".7" fill="#fff" opacity=".7"/></g>
    </g>

    <ellipse cx="24" cy="76" rx="3.6" ry="2.2" fill="#ff9ec0" opacity=".85"/>
    <ellipse cx="62" cy="76" rx="3.6" ry="2.2" fill="#ff9ec0" opacity=".85"/>

    <!-- Miệng cười (mouth-laugh) -->
    <g transform="translate(30 73)"><g class="p-mouth">
      <path d="M4.5 1.8h17a8.5 8.5 0 0 1-17 0" fill="#44403c"/>
      <path d="M6.3 1.8h13.4v1.6a1.2 1.2 0 0 1-1.2 1.2h-11a1.2 1.2 0 0 1-1.2-1.2Z" fill="#fff"/>
      <path d="M10.5 7h5v.4a2.5 2.5 0 0 1-5 0Z" fill="#c96f5e"/>
    </g></g>
  </g>
</svg>
