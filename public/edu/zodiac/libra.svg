<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" aria-hidden="true">
  <!-- Libra (♎, Thiên Bình) — mascot cung hoàng đạo của Education Hugo. Thiết kế gốc © Hugo Studio.
       Theo khuôn geminus.svg (style đất sét cast-*.svg). Riêng Libra: thân xanh lá #58CC02,
       đội cân công lý vàng #FFC800 trên đầu — đòn cân bập bênh, hai đĩa luôn treo thẳng. -->
  <style>
    .l-hop{transform-box:fill-box;transform-origin:50% 100%;animation:l-hop 1.2s cubic-bezier(.3,0,.4,1) infinite}
    .l-shadow{transform-box:fill-box;transform-origin:50% 50%;animation:l-shadow 1.2s cubic-bezier(.3,0,.4,1) infinite}
    .l-eye{transform-box:fill-box;transform-origin:50% 50%;animation:l-blink 3.6s infinite}
    .l-beam{transform-box:view-box;transform-origin:50px 16px;animation:l-tilt 2.4s ease-in-out infinite}
    .l-pan{transform-box:fill-box;transform-origin:50% 0;animation:l-hang 2.4s ease-in-out infinite}
    .l-mouth{transform-box:fill-box;transform-origin:50% 0;animation:l-grin 1.2s ease-in-out infinite}
    @keyframes l-hop{0%,100%{transform:translateY(0) scale(1.05,.94)}15%{transform:translateY(0) scale(.96,1.05)}45%{transform:translateY(-7px) rotate(-3deg)}70%{transform:translateY(0) scale(1.03,.96) rotate(2deg)}}
    @keyframes l-shadow{0%,100%,70%{transform:scale(1)}45%{transform:scale(.72);opacity:.6}}
    @keyframes l-blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
    @keyframes l-tilt{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
    @keyframes l-hang{0%,100%{transform:rotate(9deg)}50%{transform:rotate(-9deg)}}
    @keyframes l-grin{0%,100%{transform:scaleY(1)}45%{transform:scaleY(1.2)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <path id="l-body" d="M27 92c-4-9-5-19-3-30 3-16 12-28 26-28s23 12 26 28c2 11 1 21-3 30-9 1.6-37 1.6-46 0"/>
    <clipPath id="l-clip"><use href="#l-body"/></clipPath>
    <mask id="l-lit"><use href="#l-body" fill="#fff"/><use href="#l-body" fill="#000" transform="translate(2.8 3.2)"/></mask>
    <mask id="l-dim"><use href="#l-body" fill="#fff"/><use href="#l-body" fill="#000" transform="translate(-2.8 -3.2)"/></mask>
    <g id="l-pan">
      <path d="M0 0-6.5 11M0 0l6.5 11" stroke="#c99400" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M-7.5 11h15a7.5 5 0 0 1-15 0" fill="#ffc800"/>
      <path d="M-7.5 11h15a7.5 5 0 0 1-1 2.5h-13a7.5 5 0 0 1-1-2.5" fill="#fff" opacity=".35"/>
    </g>
  </defs>

  <ellipse class="l-shadow" cx="50" cy="92.8" rx="26" ry="3.2" fill="#44403c" opacity=".13"/>

  <g class="l-hop">
    <!-- Cân công lý trên đầu -->
    <path d="M50 35V16" stroke="#e0a800" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="50" cy="35" rx="6" ry="2.2" fill="#e0a800"/>
    <g class="l-beam">
      <path d="M32 16h36" stroke="#ffc800" stroke-width="2.6" stroke-linecap="round"/>
      <g class="l-pan"><use href="#l-pan" x="32" y="16"/></g>
      <g class="l-pan"><use href="#l-pan" x="68" y="16"/></g>
    </g>
    <circle cx="50" cy="13.5" r="3" fill="#ffc800"/><circle cx="49" cy="12.5" r=".9" fill="#fff" opacity=".7"/>

    <!-- Thân + viền đất sét -->
    <g clip-path="url(#l-clip)">
      <rect width="100" height="100" fill="#58cc02"/>
      <rect width="100" height="100" fill="#fff" opacity=".2" mask="url(#l-lit)"/>
      <rect width="100" height="100" fill="#44403c" opacity=".12" mask="url(#l-dim)"/>
    </g>

    <!-- Mắt (eyes-even) -->
    <g transform="translate(29 43)">
      <circle cx="10.5" cy="11" r="7" fill="#44403c" opacity=".15"/><circle cx="32.5" cy="11" r="7" fill="#44403c" opacity=".15"/>
      <circle cx="10" cy="10" r="7" fill="#fff"/><circle cx="32" cy="10" r="7" fill="#fff"/>
      <g class="l-eye"><circle cx="11" cy="11.8" r="2.9" fill="#44403c"/><circle cx="10" cy="10.6" r=".7" fill="#fff" opacity=".7"/></g>
      <g class="l-eye"><circle cx="31" cy="11.8" r="2.9" fill="#44403c"/><circle cx="30" cy="10.6" r=".7" fill="#fff" opacity=".7"/></g>
    </g>

    <ellipse cx="32" cy="64" rx="4" ry="2.4" fill="#ff9ec0" opacity=".85"/>
    <ellipse cx="68" cy="64" rx="4" ry="2.4" fill="#ff9ec0" opacity=".85"/>

    <!-- Miệng cười (mouth-laugh) -->
    <g transform="translate(37 62)"><g class="l-mouth">
      <path d="M4.5 1.8h17a8.5 8.5 0 0 1-17 0" fill="#44403c"/>
      <path d="M6.3 1.8h13.4v1.6a1.2 1.2 0 0 1-1.2 1.2h-11a1.2 1.2 0 0 1-1.2-1.2Z" fill="#fff"/>
      <path d="M10.5 7h5v.4a2.5 2.5 0 0 1-5 0Z" fill="#c96f5e"/>
    </g></g>
  </g>
</svg>
