<!doctype html>
<!--
  Cảnh video "Khởi đầu" của Education Hugo (1280×720, ngang). Không tự chạy: render.mjs gọi
  window.build(video, lang, durations) rồi window.seek(t) từng khung — mọi chuyển động nằm trong
  MỘT GSAP timeline nên khung nào cũng tái tạo được (không dùng CSS animation).
  video = "vscode" (khoá Coding: cài Visual Studio Code) | "sql" (khoá SQL: công cụ trong khoá).
  Dấu bản quyền "© Education Hugo" nằm cố định ở góc, có mặt trong mọi khung.
-->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24..48,500,1,0&display=block" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif; color: #2b2b2b; -webkit-font-smoothing: antialiased; }
.ms { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; line-height: 1; white-space: nowrap; font-feature-settings: "liga"; }
.mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
#stage { position: relative; width: 1280px; height: 720px; background: #e3f6fd; overflow: hidden; }
.layer { position: absolute; left: 300px; top: 36px; width: 940px; height: 500px; opacity: 0; visibility: hidden; }

/* Người dẫn + phụ đề */
#host { position: absolute; left: 34px; bottom: 26px; width: 210px; transform-origin: 50% 100%; z-index: 30; }
#host img { display: block; width: 100%; }
#sub { position: absolute; z-index: 40; left: 280px; right: 40px; bottom: 34px; height: 116px; border-radius: 28px; background: #fff; box-shadow: 0 6px 0 rgb(0 0 0 / .08); }
#sub::before { content: ""; position: absolute; left: -20px; bottom: 34px; border: 16px solid transparent; border-right: 22px solid #fff; border-left: 0; }
#sub p { position: absolute; left: 30px; right: 30px; top: 50%; translate: 0 -50%; font-size: 31px; font-weight: 750; line-height: 1.25; text-align: center; opacity: 0; }

/* Bản quyền: luôn hiện */
#mark { position: absolute; z-index: 60; right: 22px; top: 14px; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; background: rgb(255 255 255 / .82); font-size: 15px; font-weight: 800; color: #0a92c2; letter-spacing: .02em; }
#mark img { width: 22px; }

/* Khung cửa sổ dùng chung */
.win { position: absolute; inset: 0; border-radius: 18px; background: #fff; box-shadow: 0 10px 0 rgb(0 0 0 / .08); overflow: hidden; border: 3px solid #d9e6ee; }
.win-top { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #f1f4f7; border-bottom: 2px solid #e3e9ee; }
.dot { width: 13px; height: 13px; border-radius: 50%; background: #ff6159; } .dot:nth-child(2) { background: #ffbd2e; } .dot:nth-child(3) { background: #28c941; }
.url { margin-left: 16px; flex: 1; height: 30px; border-radius: 15px; background: #fff; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 17px; color: #3c3c3c; overflow: hidden; }
.url .typed { display: inline-block; overflow: hidden; white-space: nowrap; width: 0; }
.bar { height: 16px; border-radius: 8px; background: #e6edf2; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 58px; padding: 0 30px; border-radius: 14px; background: #1cb0f6; color: #fff; font-size: 24px; font-weight: 800; box-shadow: 0 5px 0 #1899d6; }
.btn.alt { background: #fff; color: #1899d6; border: 3px solid #d9e6ee; box-shadow: 0 5px 0 #d9e6ee; }
.chip { position: absolute; padding: 10px 20px; border-radius: 99px; background: #1f2b3a; color: #fff; font-size: 20px; font-weight: 700; white-space: nowrap; opacity: 0; }
.cursor { position: absolute; z-index: 20; font-size: 54px; color: #1f2b3a; opacity: 0; text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff; }
.ring { position: absolute; z-index: 19; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 5px solid #ff4b4b; opacity: 0; }

/* Thẻ giới thiệu */
.hero { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 22px; text-align: center; }
.tile { display: grid; place-items: center; width: 150px; height: 150px; border-radius: 36px; color: #fff; font-size: 96px; box-shadow: 0 8px 0 rgb(0 0 0 / .14); }
.hero h2 { font-size: 46px; font-weight: 850; }
.hero .chip { position: static; opacity: 1; }

/* Trình cài Windows */
.dlg { position: absolute; left: 140px; top: 40px; width: 660px; height: 400px; border-radius: 12px; background: #f3f3f3; border: 2px solid #cfd6dc; box-shadow: 0 16px 40px rgb(0 0 0 / .18); }
.dlg h3 { height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 18px; font-size: 19px; background: #fff; border-bottom: 1px solid #ddd; }
.check { display: flex; align-items: center; gap: 14px; margin: 24px 30px 0; font-size: 21px; }
.box { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 6px; border: 3px solid #8a96a0; background: #fff; color: #fff; font-size: 30px; }
.progress { margin: 40px 30px 0; height: 18px; border-radius: 9px; background: #dde3e8; overflow: hidden; } .progress i { display: block; height: 100%; width: 0; background: #1cb0f6; }
.dlg .acts { position: absolute; right: 24px; bottom: 22px; display: flex; gap: 14px; }

/* Mac: kéo vào Ứng dụng */
.finder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 120px; }
.icon { display: grid; justify-items: center; gap: 12px; font-size: 22px; font-weight: 700; }
.icon .ms { display: grid; place-items: center; width: 140px; height: 140px; border-radius: 32px; font-size: 90px; }
.arrow { font-size: 90px; color: #1cb0f6; }

/* Trình soạn mã tối */
.ide { position: absolute; inset: 0; border-radius: 18px; background: #1e1e1e; overflow: hidden; box-shadow: 0 10px 0 rgb(0 0 0 / .14); color: #d4d4d4; }
.ide-top { height: 40px; display: flex; align-items: center; gap: 24px; padding: 0 18px; background: #323233; font-size: 17px; color: #ccc; }
.ide-side { position: absolute; left: 0; top: 40px; bottom: 0; width: 250px; background: #252526; padding: 14px 16px; font-size: 16px; }
.ide-side small { color: #999; font-weight: 700; letter-spacing: .08em; }
.ide-side .item { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 18px; opacity: 0; }
.ide-main { position: absolute; left: 250px; right: 0; top: 40px; bottom: 0; padding: 0; }
.tab { display: inline-flex; align-items: center; gap: 10px; height: 42px; padding: 0 18px; background: #1e1e1e; border-top: 2px solid #1cb0f6; font-size: 17px; opacity: 0; }
.code { padding: 22px 26px; font-size: 24px; line-height: 1.7; }
.code div { overflow: hidden; white-space: nowrap; width: 0; }
.menu { position: absolute; left: 14px; top: 40px; width: 300px; padding: 8px 0; border-radius: 8px; background: #2d2d30; box-shadow: 0 12px 30px rgb(0 0 0 / .4); z-index: 5; transform-origin: 0 0; transform: scale(0); font-size: 19px; }
.menu div { padding: 10px 18px; } .menu .on { background: #04395e; }

/* Ô SQL (sáng) */
.sql { position: absolute; inset: 0; border-radius: 18px; background: #fff; border: 3px solid #d9e6ee; box-shadow: 0 10px 0 rgb(0 0 0 / .08); padding: 22px 26px; }
.sql h4 { font-size: 20px; color: #777; display: flex; align-items: center; gap: 8px; }
.sql .code { margin-top: 12px; padding: 16px 20px; border-radius: 12px; background: #f6f8fa; color: #1f2b3a; font-size: 23px; line-height: 1.55; }
.sql .kw { color: #1899d6; font-weight: 700; }
.sql .row { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
.table { margin-top: 16px; border-collapse: collapse; font-size: 21px; opacity: 0; }
.table td, .table th { padding: 7px 22px; border-bottom: 2px solid #eef2f5; text-align: left; } .table th { color: #777; }
.err { margin-top: 16px; padding: 14px 18px; border-radius: 12px; background: #ffdfe0; color: #c62828; font-size: 21px; font-weight: 700; opacity: 0; }
.hint { margin-top: 12px; padding: 14px 18px; border-radius: 12px; background: #e8f6fe; color: #1f5f80; font-size: 21px; font-weight: 600; opacity: 0; }

/* Lược đồ quán Hạt */
.schema { position: absolute; inset: 0; }
.tbl { position: absolute; width: 270px; border-radius: 14px; background: #fff; border: 3px solid #d9e6ee; box-shadow: 0 6px 0 #d9e6ee; overflow: hidden; opacity: 0; }
.tbl b { display: block; padding: 10px 16px; background: #1cb0f6; color: #fff; font-size: 20px; }
.tbl span { display: block; padding: 5px 16px; font-size: 18px; color: #3c3c3c; } .tbl span:first-of-type { padding-top: 10px; } .tbl span:last-child { padding-bottom: 12px; }
.schema svg { position: absolute; inset: 0; }

/* Lộ trình */
.path { position: absolute; inset: 0; }
.node { position: absolute; display: grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; color: #fff; font-size: 18px; font-weight: 900; box-shadow: 0 6px 0 rgb(0 0 0 / .15); transform: scale(0); }

.toast { position: absolute; left: 50%; top: 120px; margin-left: -85px; display: grid; place-items: center; width: 170px; height: 170px; border-radius: 50%; background: #58cc02; color: #fff; font-size: 110px; transform: scale(0); box-shadow: 0 8px 0 #58a700; }
.ready { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font-size: 46px; font-weight: 850; color: #1f2b3a; opacity: 0; }
</style></head>
<body><div id="stage">
  <div id="mark"><img src="cast-1.svg" alt=""><span>© Education Hugo</span><span id="voice" style="font-weight:600;color:#5b6b75"></span></div>
  <div id="host"><img src="cast-1.svg" alt=""></div>
  <div id="sub"></div>
  <div id="layers"></div>
</div>
<script src="gsap.min.js"></script>
<script>
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
let tl;

// Mỗi cảnh: { dur (giây mặc định), html(ui), anim(tl, root, t0, d) }. t0 = giây bắt đầu cảnh trong timeline.
const cursor = (x, y) => `<span class="ms cursor" style="left:${x}px;top:${y}px">arrow_selector_tool</span><i class="ring"></i>`;
function click(t, root, at, x, y) {
  const c = $(".cursor", root), r = $(".ring", root);
  t.to(c, { left: x, top: y, opacity: 1, duration: .7, ease: "power2.inOut" }, at);
  t.fromTo(r, { left: x + 14, top: y + 12, scale: .3, opacity: 1 }, { scale: 1.4, opacity: 0, duration: .5 }, at + .75);
  t.to(c, { scale: .85, duration: .1, yoyo: true, repeat: 1 }, at + .7);
}
const typeIn = (t, nodes, at, each = .9) => nodes.forEach((n, i) => t.to(n, { width: "auto", duration: each, ease: "steps(24)" }, at + i * each));

const SCENES = {
  vscode: {
    host: "cast-1.svg",
    intro: { dur: 6, html: (u) => `<div class="hero"><span class="ms tile" style="background:#1cb0f6">code</span><h2>Visual Studio Code</h2><span class="chip">${u.free}</span></div>`,
      anim: (t, r, a) => { t.from($(".tile", r), { scale: 0, rotate: -20, duration: .7, ease: "back.out(2)" }, a + .2); t.from($("h2", r), { y: 30, opacity: 0, duration: .5 }, a + .7); t.from($(".chip", r), { y: 20, opacity: 0, duration: .5 }, a + 1.1); } },
    site: { dur: 6, html: (u) => `<div class="win"><div class="win-top"><i class="dot"></i><i class="dot"></i><i class="dot"></i><div class="url"><span class="ms" style="color:#58a700">lock</span><span class="typed">code.visualstudio.com</span></div></div>
        <div style="padding:60px 70px;display:grid;gap:20px"><div class="bar" style="width:55%;height:30px"></div><div class="bar" style="width:80%"></div><div class="bar" style="width:70%"></div><div style="margin-top:20px"><span class="btn"><span class="ms">download</span>${u.download}</span></div></div></div>`,
      anim: (t, r, a) => { t.to($(".typed", r), { width: "auto", duration: 1.6, ease: "steps(21)" }, a + .4); t.from($$(".bar", r), { width: 0, duration: .5, stagger: .12 }, a + 2.2); t.from($(".btn", r), { scale: 0, duration: .5, ease: "back.out(2)" }, a + 2.8); } },
    pick: { dur: 7, html: (u) => `<div class="win"><div class="win-top"><i class="dot"></i><i class="dot"></i><i class="dot"></i><div class="url"><span class="ms" style="color:#58a700">lock</span>code.visualstudio.com/download</div></div>
        <div style="display:flex;gap:40px;justify-content:center;padding-top:110px"><span class="btn b-win"><span class="ms">desktop_windows</span>${u.windows}</span><span class="btn alt b-mac"><span class="ms">laptop_mac</span>${u.mac}</span></div>
        <span class="chip c-win" style="left:250px;top:330px">VSCodeUserSetup.exe</span><span class="chip c-mac" style="left:470px;top:330px">VSCode-darwin-universal.zip</span>${cursor(800, 420)}</div>`,
      anim: (t, r, a) => { click(t, r, a + .8, 340, 175); t.to($(".c-win", r), { opacity: 1, y: -10, duration: .4 }, a + 1.6); click(t, r, a + 3.4, 600, 175); t.to($(".c-mac", r), { opacity: 1, y: -10, duration: .4 }, a + 4.2); } },
    win: { dur: 9, html: (u) => `<div class="dlg"><h3><span class="ms" style="color:#1cb0f6">code</span>${u.installer}</h3>
        <div class="check k1"><span class="box ms">check</span>${u.chk1}</div><div class="check k2"><span class="box ms">check</span>${u.chk2}</div>
        <div class="progress"><i></i></div><div class="acts"><span class="btn b-ins" style="height:50px;font-size:20px">${u.install}</span><span class="btn alt b-fin" style="height:50px;font-size:20px;opacity:0">${u.finish}</span></div></div>${cursor(860, 460)}`,
      anim: (t, r, a) => { t.from($(".dlg", r), { y: 40, opacity: 0, duration: .5 }, a + .2);
        click(t, r, a + 1.6, 175, 145); t.to($(".k1 .box", r), { background: "#1cb0f6", borderColor: "#1cb0f6", duration: .2 }, a + 2.35);
        click(t, r, a + 3, 175, 203); t.to($(".k2 .box", r), { background: "#1cb0f6", borderColor: "#1cb0f6", duration: .2 }, a + 3.75);
        click(t, r, a + 4.6, 700, 385); t.to($(".progress i", r), { width: "100%", duration: 2, ease: "power1.inOut" }, a + 5.4);
        t.to($(".b-ins", r), { opacity: 0, duration: .2 }, a + 7.3); t.to($(".b-fin", r), { opacity: 1, duration: .2 }, a + 7.3); click(t, r, a + 7.6, 720, 385); } },
    mac: { dur: 8, html: (u) => `<div class="finder"><div class="icon app"><span class="ms" style="background:#1cb0f6;color:#fff">code</span>Visual Studio Code</div><span class="ms arrow">arrow_forward</span><div class="icon dir"><span class="ms" style="background:#cfe9fb;color:#1899d6">folder</span>${u.apps}</div></div>
        <span class="chip c-open" style="left:380px;top:430px">${u.open} ✓</span>`,
      anim: (t, r, a) => { t.from($(".finder", r), { opacity: 0, duration: .4 }, a + .1); t.from($(".arrow", r), { x: -30, opacity: 0, duration: .5 }, a + .8);
        t.to($(".app", r), { x: 430, scale: .55, opacity: .2, duration: 1.4, ease: "power2.in" }, a + 2); t.to($(".dir .ms", r), { scale: 1.15, duration: .2, yoyo: true, repeat: 1 }, a + 3.4);
        t.to($(".c-open", r), { opacity: 1, y: -12, duration: .4 }, a + 4.8); } },
    folder: { dur: 9, html: (u) => `<div class="ide"><div class="ide-top"><span class="m-file">File</span><span>Edit</span><span>View</span></div>
        <div class="menu"><div>New File</div><div class="on">Open Folder…</div><div>Save</div></div>
        <div class="ide-side"><small>${u.explorer}</small><div class="item i-dir"><span class="ms" style="color:#dcb67a">folder_open</span>NHIP</div></div>
        <div class="ide-main" style="display:grid;place-items:center"><div class="icon d-icon"><span class="ms" style="background:#dcb67a;color:#fff">folder</span><span style="color:#ddd">nhip · ${u.desktop}</span></div></div></div>${cursor(600, 300)}`,
      anim: (t, r, a) => { t.from($(".d-icon", r), { scale: 0, duration: .5, ease: "back.out(2)" }, a + .6);
        click(t, r, a + 2.4, 22, 8); t.to($(".menu", r), { scale: 1, duration: .25 }, a + 3.1); click(t, r, a + 3.8, 120, 92);
        t.to($(".menu", r), { scale: 0, duration: .2 }, a + 4.6); t.to($(".d-icon", r), { x: -380, y: -160, scale: .2, opacity: 0, duration: .9, ease: "power2.in" }, a + 4.9); t.to($(".i-dir", r), { opacity: 1, duration: .3 }, a + 5.7); } },
    file: { dur: 9, html: (u) => `<div class="ide"><div class="ide-top"><span>File</span><span>Edit</span><span>View</span></div>
        <div class="ide-side"><small>${u.explorer}</small><div class="item" style="opacity:1"><span class="ms" style="color:#dcb67a">folder_open</span>NHIP</div><div class="item f-item" style="padding-left:20px"><span class="ms" style="color:#e44d26">html</span>hello.html</div></div>
        <div class="ide-main"><span class="tab"><span class="t-name">hello.html</span><span class="ms t-dot" style="font-size:16px">circle</span></span>
        <div class="code mono"><div><span style="color:#808080">&lt;!doctype html&gt;</span></div><div><span style="color:#569cd6">&lt;h1&gt;</span>Xin chào, Nhịp!<span style="color:#569cd6">&lt;/h1&gt;</span></div></div></div>
        <span class="chip c-save" style="left:560px;top:400px">Ctrl + S · ⌘ + S — ${u.save}</span></div>`,
      anim: (t, r, a) => { t.to($(".f-item", r), { opacity: 1, duration: .3 }, a + .6); t.to($(".tab", r), { opacity: 1, duration: .3 }, a + 1);
        typeIn(t, $$(".code div", r), a + 1.6, 1.4); t.to($(".c-save", r), { opacity: 1, y: -10, duration: .4 }, a + 5.4); t.to($(".t-dot", r), { opacity: 0, duration: .2 }, a + 5.6); } },
    done: { dur: 5, html: (u) => `<div><span class="ms toast">check</span><div class="ready">${u.ready}</div></div>`,
      anim: (t, r, a) => { t.to($(".toast", r), { scale: 1, duration: .6, ease: "back.out(2.5)" }, a + .2); t.to($(".ready", r), { opacity: 1, y: -10, duration: .5 }, a + .8); } },
  },
  sql: {
    host: "buddy-learn.svg",
    intro: { dur: 6, html: (u) => `<div class="hero"><span class="ms tile" style="background:#58cc02">public</span><h2>${u.noInstall}</h2><span class="chip">${u.browser}</span></div>`,
      anim: (t, r, a) => { t.from($(".tile", r), { scale: 0, rotate: 20, duration: .7, ease: "back.out(2)" }, a + .2); t.from($("h2", r), { y: 30, opacity: 0, duration: .5 }, a + .7); t.from($(".chip", r), { y: 20, opacity: 0, duration: .5 }, a + 1.1); } },
    editor: { dur: 9, html: (u) => `<div class="sql"><h4><span class="ms">database</span>${u.editor}</h4>
        <div class="code mono"><div><span class="kw">SELECT</span> name, price</div><div><span class="kw">FROM</span> menu_items</div><div><span class="kw">ORDER BY</span> price <span class="kw">DESC</span></div><div><span class="kw">LIMIT</span> 3;</div></div>
        <div class="row"><span class="btn b-run" style="height:50px;font-size:20px"><span class="ms">play_arrow</span>${u.run}</span><span class="chip" style="position:static;opacity:1;background:#eef2f5;color:#3c3c3c">${u.shortcut}</span></div>
        <table class="table"><tr><th>name</th><th>price</th></tr><tr><td>Matcha latte</td><td>45000</td></tr><tr><td>Cold brew</td><td>39000</td></tr><tr><td>Trà đào</td><td>35000</td></tr></table></div>`,
      anim: (t, r, a) => { t.from($(".sql", r), { y: 30, opacity: 0, duration: .4 }, a + .1); typeIn(t, $$(".code div", r), a + .8, .8);
        t.to($(".b-run", r), { scale: .9, duration: .12, yoyo: true, repeat: 1 }, a + 4.4); t.to($(".table", r), { opacity: 1, duration: .4 }, a + 4.8); t.from($$(".table tr", r), { x: -20, opacity: 0, stagger: .15, duration: .3 }, a + 4.8); } },
    data: { dur: 8, html: (u) => `<div class="schema"><svg width="940" height="500"><g stroke="#9fd6f2" stroke-width="4" fill="none" stroke-dasharray="8 8"><path d="M290 110 C380 110 380 120 470 120"/><path d="M610 230 L610 290"/><path d="M290 330 C380 330 380 370 470 370"/></g></svg>
        <div class="tbl" style="left:20px;top:20px"><b>customers</b><span>id</span><span>name</span><span>phone</span><span>joined_at</span></div>
        <div class="tbl" style="left:470px;top:30px"><b>orders</b><span>id</span><span>customer_id</span><span>ordered_at</span></div>
        <div class="tbl" style="left:470px;top:290px"><b>order_items</b><span>order_id</span><span>item_id</span><span>qty</span></div>
        <div class="tbl" style="left:20px;top:250px"><b>menu_items</b><span>id</span><span>name</span><span>category</span><span>price</span></div>
        <span class="chip c-name" style="left:20px;top:455px">${u.tables}</span></div>`,
      anim: (t, r, a) => { t.to($$(".tbl", r), { opacity: 1, stagger: .5, duration: .4 }, a + .4); t.from($$(".tbl", r), { y: 20, stagger: .5, duration: .4 }, a + .4); t.from($$("path", r), { opacity: 0, stagger: .3, duration: .4 }, a + 2.6); t.to($(".c-name", r), { opacity: 1, duration: .4 }, a + 3.4); } },
    mistake: { dur: 7, html: (u) => `<div class="sql"><h4><span class="ms">database</span>${u.editor}</h4><div class="code mono"><div><span class="kw">SELECT</span> prise <span class="kw">FROM</span> menu_items;</div></div>
        <div class="err"><span class="ms" style="vertical-align:-5px">error</span> ${u.error}</div><div class="hint"><span class="ms" style="vertical-align:-5px">lightbulb</span> ${u.hint}: price</div></div>`,
      anim: (t, r, a) => { typeIn(t, $$(".code div", r), a + .5, 1.2); t.to($(".err", r), { opacity: 1, duration: .3 }, a + 2.2); t.from($(".err", r), { x: -12, duration: .08, repeat: 3, yoyo: true }, a + 2.2); t.to($(".hint", r), { opacity: 1, y: -6, duration: .4 }, a + 4); } },
    path: { dur: 8, html: (u) => { const tones = ["#1cb0f6", "#58cc02", "#ce82ff", "#ff86d0", "#ff9600", "#2b70c9", "#00cd9c", "#ffc800"];
        return `<div class="path">${tones.map((c, i) => `<span class="node" style="background:${c};left:${40 + i * 108}px;top:${i % 2 ? 210 : 110}px">${101 + (i >> 1) * 100 + (i & 1)}</span>`).join("")}
        <span class="chip c1" style="left:40px;top:340px">${u.stages}</span><span class="chip c2" style="left:40px;top:400px">${u.pass}</span></div>`; },
      anim: (t, r, a) => { t.to($$(".node", r), { scale: 1, stagger: .25, duration: .4, ease: "back.out(2)" }, a + .3); t.to($(".c1", r), { opacity: 1, duration: .4 }, a + 2.6); t.to($(".c2", r), { opacity: 1, duration: .4 }, a + 3.6); } },
    done: { dur: 5, html: (u) => `<div><span class="ms toast">check</span><div class="ready">${u.ready}</div></div>`,
      anim: (t, r, a) => { t.to($(".toast", r), { scale: 1, duration: .6, ease: "back.out(2.5)" }, a + .2); t.to($(".ready", r), { opacity: 1, y: -10, duration: .5 }, a + .8); } },
  },
};

window.ready = () => document.fonts.ready;

/** Dựng timeline; durations[i] (giây, từ lồng tiếng) kéo dài cảnh nếu lời dài hơn mặc định. Trả tổng thời lượng. */
window.build = (video, lang, durations = [], voiced = false) => {
  // Gói Free của ElevenLabs bắt buộc ghi công: có lồng tiếng thì luôn ghi.
  $("#voice").textContent = voiced ? `· ${window.VIDEO_COPY.voiceCredit[lang]}` : "";
  const def = SCENES[video], copy = window.VIDEO_COPY[video][lang];
  $("#host img").src = def.host;
  const layers = $("#layers"), sub = $("#sub");
  layers.innerHTML = ""; sub.innerHTML = "";
  tl = gsap.timeline({ paused: true });
  // Người dẫn nhún nhẹ suốt video.
  tl.to("#host", { scaleY: .96, scaleX: 1.03, duration: .45, yoyo: true, repeat: 400, ease: "sine.inOut" }, 0);
  let at = 0;
  window.sceneStarts = [];
  copy.scenes.forEach((scene, i) => {
    const s = def[scene.id];
    const d = Math.max(s.dur, durations[i] || 0);
    window.sceneStarts.push(at);
    const root = el(`<div class="layer">${s.html(copy.ui)}</div>`);
    layers.appendChild(root);
    tl.set(root, { autoAlpha: 1 }, at).set(root, { autoAlpha: 0 }, at + d);
    tl.from(root, { opacity: 0, duration: .3 }, at);
    s.anim(tl, root, at, d);
    // Phụ đề: chia đều thời lượng cảnh cho từng dòng.
    scene.lines.forEach((line, j) => {
      const p = el(`<p>${line}</p>`); sub.appendChild(p);
      const from = at + (d * j) / scene.lines.length, to = at + (d * (j + 1)) / scene.lines.length;
      tl.fromTo(p, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .25 }, from).set(p, { opacity: 0 }, to - .02);
    });
    at += d;
  });
  tl.set({}, {}, at);
  return at;
};
window.seek = (t) => tl.seek(t, false);
</script>
